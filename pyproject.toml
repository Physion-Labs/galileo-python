[project]
name = "physionlabs"
version = "0.1.0rc1"
description = "Official Python client for the Galileo video evaluation API."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Physion Labs", email = "support@physionlabs.ai" }]
keywords = ["galileo", "physion", "video", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.9",
]

[project.urls]
Homepage = "https://github.com/Physion-Labs/galileo-python"
Issues = "https://github.com/Physion-Labs/galileo-python/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "datamodel-code-generator>=0.26",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "mypy>=1.13",
  "referencing>=0.37.0",
  # Only to read pyproject.toml in tests/test_packaging.py on 3.10, where
  # `tomllib` is not yet in the standard library. It already arrives as a
  # transitive dependency of pytest there, which is exactly why it is declared:
  # relying on that means a test breaks the day pytest stops needing it.
  "tomli>=2.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physionlabs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/physionlabs"]
