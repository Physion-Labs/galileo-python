name: ci

on:
  push:
    branches: [main]
  pull_request:
  # So the live job can be re-run against a deployment that has changed without
  # a commit to this repo — which is most of the reason it exists. The API moves
  # on its own schedule; a contract check that can only run when the SDK changes
  # would notice a drift on whatever day someone next touched the SDK.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen
      # Fails if the contract copy was edited here instead of upstream, or if the
      # committed models are not what the contract generates.
      - run: uv run python scripts/check_contract.py
      - run: uv run mypy
      - run: uv run pytest

      # tests/test_packaging.py checks what pyproject DECLARES; this checks what
      # the wheel actually contains. The two differ in exactly the way that
      # matters: a declaration can be right while the build leaves the file out,
      # and nobody finds out until an install is missing py.typed and every
      # annotation in the package is silently ignored.
      - name: The wheel carries the marker and the license
        run: |
          uv build --wheel
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          # The dist-info directory carries the VERSION, so it is found rather
          # than spelled out. Written out, this check named `0.1.0` and broke on
          # the first release candidate — pointing at a missing license, which is
          # the wrong thing to go looking at. The same mistake was in
          # publish.yml; it lived in two places and was fixed in one.
          info = next((n.split("/")[0] for n in names if n.endswith(".dist-info/METADATA")), None)
          assert info, f"{wheel} has no dist-info"
          missing = {
              n for n in ("physionlabs/py.typed", f"{info}/licenses/LICENSE", f"{info}/licenses/NOTICE")
              if n not in names
          }
          assert not missing, f"{wheel} is missing {sorted(missing)}"
          leaked = [n for n in names if n.startswith(("tests/", "scripts/", "openapi/"))]
          assert not leaked, f"{wheel} ships {leaked}"
          print(f"{wheel}: {info}, {len(names)} entries, marker and license present")
          PY

  # Talks to the development deployment. Deliberately NOT required: it fails when
  # that deployment is down or mid-rollout, which is not the pull request's fault
  # — but it is the only check that would notice the API drifting away from the
  # contract, so it runs on every change and is read rather than gated on.
  live:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      # Named at the JOB level so a missing key is visible in the run list rather
      # than only in a log nobody opens. Without it the only endpoint this can
      # reach is /v1/status, and a green tick would then mean "the simplest
      # endpoint in the API still answers" while reading as "the contract holds".
      - name: Is there a key to verify with?
        env:
          GALILEO_API_KEY: ${{ secrets.GALILEO_CI_API_KEY }}
        run: |
          if [ -z "$GALILEO_API_KEY" ]; then
            echo "::warning title=Live verification incomplete::GALILEO_CI_API_KEY is not set.           Only /v1/status will be checked; evaluations, models and quota will not."
          fi

      # Exit 2 is this script's "INCOMPLETE" — endpoints skipped for want of a
      # key. Distinguished from exit 1, a real mismatch, because the two mean
      # opposite things about the contract and only one is a finding.
      - name: Contract against the live service
        env:
          GALILEO_API_KEY: ${{ secrets.GALILEO_CI_API_KEY }}
          GALILEO_BASE_URL: https://api-dev.physionlabs.ai
        run: |
          set +e
          uv run python scripts/verify_live.py
          code=$?
          set -e
          case "$code" in
            0) echo "::notice title=Contract verified::Every endpoint matched." ;;
            2) echo "::warning title=Contract NOT verified::Skipped for want of GALILEO_CI_API_KEY." ;;
            *) echo "::error title=Contract mismatch::The live service does not match the contract."
               exit 1 ;;
          esac
